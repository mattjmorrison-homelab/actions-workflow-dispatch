name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mattjmorrison-homelab/actions-bash@5622be3ba5bee0f4d4901e553d1ece1afbf7011d # main

      - name: actionlint
        run: actionlint

      - name: shellcheck
        run: shellcheck dispatch.sh

      - name: bats
        run: bats test/
